name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: YYYY.MM.DD-HHMMSS'
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{6}$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.version.outputs.exists != 'true'
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: |
            companion/go.sum
            gateway/go.sum
      - name: Build release bundle
        if: steps.version.outputs.exists != 'true'
        run: python3 scripts/package.py "$VERSION"
      - name: Download existing release bundle
        if: steps.version.outputs.exists == 'true'
        run: |
          mkdir -p "dist/$VERSION/bundle"
          gh release download "$VERSION" --pattern 'ai-emby-linux-amd64.tar.gz' --pattern 'SHA256SUMS' --dir "dist/$VERSION"
          (cd "dist/$VERSION" && sha256sum -c SHA256SUMS)
          python3 -c 'from scripts.updater import extract_bundle; from pathlib import Path; import os; p=Path("dist")/os.environ["VERSION"]; extract_bundle(p/"ai-emby-linux-amd64.tar.gz",p/"bundle")'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish image
        run: |
          docker build -t "ghcr.io/lll198/ai-emby:$VERSION" -t ghcr.io/lll198/ai-emby:latest "dist/$VERSION/bundle"
          docker push "ghcr.io/lll198/ai-emby:$VERSION"
          docker push ghcr.io/lll198/ai-emby:latest
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "AI Emby $VERSION" \
            --notes 'Linux amd64 release: gateway, parallel scanning and scraping, frontend and core runtime.' \
            "dist/$VERSION/ai-emby-linux-amd64.tar.gz" "dist/$VERSION/update-linux-amd64.json" "dist/$VERSION/SHA256SUMS"
