name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: YYYY.MM.DD-HHMMSS'
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{6}$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'This version has already been published.'
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: |
            companion/go.sum
            gateway/go.sum
      - name: Build release bundle
        run: python3 scripts/package.py "$VERSION"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish image
        run: |
          docker build -t "ghcr.io/lll198/ai-emby:$VERSION" -t ghcr.io/lll198/ai-emby:latest "dist/$VERSION/bundle"
          docker push "ghcr.io/lll198/ai-emby:$VERSION"
          docker push ghcr.io/lll198/ai-emby:latest
      - name: Publish release
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "AI Emby $VERSION" \
            --notes 'Linux amd64 release: gateway, parallel scanning and scraping, frontend and original runtime.' \
            "dist/$VERSION/ai-emby-linux-amd64.tar.gz" "dist/$VERSION/update-linux-amd64.json" "dist/$VERSION/SHA256SUMS"
